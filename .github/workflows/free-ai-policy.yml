name: PAX free AI policy tests

on:
  pull_request:
    branches: [feature/pax-windows-packaging]
  push:
    branches: [feature/pax-free-only-ai-router]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test free-only model allowlist
        run: python -m unittest discover -s tests -p "test_free_ai_policy.py" -v
      - name: Compile changed Python modules
        run: python -m py_compile core/free_ai_policy.py core/gemini.py memory/config_manager.py providers/llm_openai.py main.py
